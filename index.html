<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1a2e13"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="LeafDiag"/>
  <title>LeafDiag — Diagnostic foliaire</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
  <script async src="https://docs.opencv.org/4.x/opencv.js"
          onload="onOpenCvReady()" onerror="onOpenCvError()"></script>
</head>
<body>

  <!-- ── ÉCRAN CHARGEMENT ─────────────────────────────────────── -->
  <div id="screen-loading" class="screen active">
    <div class="loading-inner">
      <div class="logo-icon">🌿</div>
      <h1 class="app-title">LeafDiag</h1>
      <p class="app-subtitle">Analyse des symptômes foliaires</p>
      <div class="spinner"></div>
      <p id="loading-msg" class="loading-msg">Chargement du moteur d'analyse…</p>
    </div>
  </div>

  <!-- ── ÉCRAN PRINCIPAL ──────────────────────────────────────── -->
  <div id="screen-main" class="screen">

    <header class="app-header">
      <div class="header-left">
        <span class="header-icon">🌿</span>
        <div class="header-title">LeafDiag</div>
      </div>
      <button class="btn-icon" onclick="showHistory()" title="Historique">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/>
        </svg>
      </button>
    </header>

    <!-- Zone de scan -->
    <section class="scan-section">
      <div class="scan-zone" id="scan-zone" onclick="triggerCapture()">
        <div class="scan-placeholder" id="scan-placeholder">
          <div class="scan-icon">📷</div>
          <p class="scan-hint">Photographier ou importer<br>une feuille</p>
        </div>
        <img id="preview-img" class="preview-img" style="display:none" alt="Aperçu feuille"/>
        <canvas id="canvas-overlay" class="canvas-overlay" style="display:none"></canvas>
      </div>

      <div class="capture-row">
        <button class="btn-capture" onclick="openCamera()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Caméra
        </button>
        <button class="btn-capture" onclick="openGallery()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          Galerie
        </button>
      </div>

      <input type="file" id="input-camera"  accept="image/*" capture="environment"
             style="display:none" onchange="handleFile(this)"/>
      <input type="file" id="input-gallery" accept="image/*"
             style="display:none" onchange="handleFile(this)"/>
    </section>

    <!-- Bouton Analyser -->
    <div class="analyze-row">
      <button class="btn-analyze" id="btn-analyze" disabled onclick="runAnalysis()">
        Analyser la feuille
      </button>
    </div>

    <!-- ── RÉSULTATS ────────────────────────────────────────────── -->
    <section id="results-section" class="results-section" style="display:none">

      <!-- Carte résultat -->
      <div class="result-card">

        <!-- Badge niveau + titre -->
        <div class="result-header">
          <div class="result-title">Résultat de l'analyse</div>
          <div class="severity-badge" id="severity-badge">—</div>
        </div>

        <!-- Barre de sévérité -->
        <div class="sev-bar-wrap">
          <div class="sev-bar-labels">
            <span>Faible</span><span>Modéré</span><span>Élevé</span><span>Sévère</span>
          </div>
          <div class="sev-bar-bg">
            <div class="sev-bar-fill" id="sev-bar-fill"></div>
          </div>
        </div>

        <!-- Pourcentage uniquement -->
        <div class="severity-main">
          <div class="severity-value" id="m-severity">—</div>
          <div class="severity-label">Surface symptomatique</div>
        </div>

      </div>

      <!-- Toggle visualisation -->
      <div class="viz-toggle">
        <button class="viz-btn active" id="btn-heatmap" onclick="showViz('heatmap')">
          Carte thermique
        </button>
        <button class="viz-btn" id="btn-mask" onclick="showViz('mask')">
          Zones détectées
        </button>
      </div>

      <div class="canvas-row">
        <canvas id="canvas-heatmap" class="result-canvas"></canvas>
        <canvas id="canvas-mask"    class="result-canvas" style="display:none"></canvas>
      </div>

      <!-- Niveau de gravité — message simple et universel -->
      <div class="level-box" id="level-box"></div>

      <!-- Actions -->
      <div class="action-row">
       <button class="btn-action" onclick="saveResult()">💾 Sauvegarder</button>
        <button class="btn-action" onclick="resetApp()">🔄 Nouvelle analyse</button>
      </div>

    </section>
  </div><!-- /screen-main -->

  <!-- ── ÉCRAN HISTORIQUE ─────────────────────────────────────── -->
  <div id="screen-history" class="screen">
    <header class="app-header">
      <button class="btn-icon" onclick="showMain()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="header-title" style="flex:1;text-align:center">Historique</div>
      <button class="btn-icon" onclick="clearHistory()" title="Effacer tout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
    </header>
    <div id="history-list" class="history-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
